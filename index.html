<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>AI Study Buddy</title>

        <style>
            * {
                  box-sizing: border-box;
                        margin: 0;
                              padding: 0;
                                  }

                                      body {
                                            font-family: Arial, sans-serif;
                                                  background: #f5f7fb;
                                                        color: #1f2937;
                                                              min-height: 100vh;
                                                                  }

                                                                      header {
                                                                            background: #ffffff;
                                                                                  padding: 20px;
                                                                                        text-align: center;
                                                                                              border-bottom: 1px solid #e5e7eb;
                                                                                                  }

                                                                                                      header h1 {
                                                                                                            font-size: 26px;
                                                                                                                  margin-bottom: 6px;
                                                                                                                      }

                                                                                                                          header p {
                                                                                                                                color: #6b7280;
                                                                                                                                      font-size: 14px;
                                                                                                                                          }

                                                                                                                                              main {
                                                                                                                                                    max-width: 700px;
                                                                                                                                                          margin: 30px auto;
                                                                                                                                                                padding: 0 16px;
                                                                                                                                                                    }

                                                                                                                                                                        .welcome {
                                                                                                                                                                              text-align: center;
                                                                                                                                                                                    margin-bottom: 25px;
                                                                                                                                                                                        }

                                                                                                                                                                                            .welcome h2 {
                                                                                                                                                                                                  font-size: 24px;
                                                                                                                                                                                                        margin-bottom: 8px;
                                                                                                                                                                                                            }

                                                                                                                                                                                                                .welcome p {
                                                                                                                                                                                                                      color: #6b7280;
                                                                                                                                                                                                                          }

                                                                                                                                                                                                                              .card {
                                                                                                                                                                                                                                    background: white;
                                                                                                                                                                                                                                          padding: 20px;
                                                                                                                                                                                                                                                border-radius: 16px;
                                                                                                                                                                                                                                                      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                              textarea {
                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                          min-height: 130px;
                                                                                                                                                                                                                                                                                padding: 15px;
                                                                                                                                                                                                                                                                                      border: 1px solid #d1d5db;
                                                                                                                                                                                                                                                                                            border-radius: 12px;
                                                                                                                                                                                                                                                                                                  resize: vertical;
                                                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                                                              outline: none;
                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                      textarea:focus {
                                                                                                                                                                                                                                                                                                                            border-color: #6366f1;
                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                    button {
                                                                                                                                                                                                                                                                                                                                          width: 100%;
                                                                                                                                                                                                                                                                                                                                                margin-top: 12px;
                                                                                                                                                                                                                                                                                                                                                      padding: 14px;
                                                                                                                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                                                                                                                  border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                                        background: #4f46e5;
                                                                                                                                                                                                                                                                                                                                                                              color: white;
                                                                                                                                                                                                                                                                                                                                                                                    font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                          font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                        button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                              background: #4338ca;
                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                      .features {
                                                                                                                                                                                                                                                                                                                                                                                                                            display: grid;
                                                                                                                                                                                                                                                                                                                                                                                                                                  grid-template-columns: repeat(3, 1fr);
                                                                                                                                                                                                                                                                                                                                                                                                                                        gap: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                      .feature {
                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 15px 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: #eef2ff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            footer {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 30px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: #9ca3af;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            @media (max-width: 500px) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .features {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          grid-template-columns: 1fr;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>📚 AI Study Buddy</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>Your personal AI learning assistant</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section class="welcome">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h2>What do you want to learn?</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Ask a question and your AI Study Buddy will help.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <section class="card">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <textarea
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          id="question"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="Example: Explain photosynthesis in simple words..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button id="askButton">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Ask AI
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="features">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="feature">💡 Simple Explanations</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="feature">📝 Quizzes</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="feature">🗂️ Flashcards</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            AI Study Buddy © 2026
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
